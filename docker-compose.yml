services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: battery-optimizer-api

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8000/health"
        ]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: battery-optimizer-dashboard

    ports:
      - "8501:8501"

    environment:
      API_URL: "http://api:8000"

    depends_on:
      api:
        condition: service_healthy